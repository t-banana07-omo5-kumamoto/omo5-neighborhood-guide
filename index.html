<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMO5熊本：通常営業（曜日別）ご近所ガイド</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --omo-black:#1c1917;
      --omo-gold:#d97706;
      --omo-red:#991b1b;
      --omo-bg:#fafaf9;
    }
    body{font-family:'Noto Sans JP',sans-serif;background:var(--omo-bg);color:var(--omo-black);}
    .chart-container{position:relative;width:120px;height:120px;margin:auto;}
    .day-active{background-color:var(--omo-red)!important;color:white!important;transform:scale(1.05);}
    .cat-active{background-color:var(--omo-gold)!important;color:white!important;}
    .custom-shadow{box-shadow:0 10px 15px -3px rgba(0,0,0,0.05),0 4px 6px -2px rgba(0,0,0,0.02);}
    .no-scrollbar::-webkit-scrollbar{display:none;}
    .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
  </style>
</head>

<body class="antialiased min-h-screen">

  <header class="bg-stone-900 text-white pt-10 pb-16 px-6 rounded-b-[3rem] shadow-2xl relative overflow-hidden">
    <div class="max-w-6xl mx-auto relative z-10">
      <div class="inline-flex items-center gap-2 px-3 py-1 bg-amber-600/20 text-amber-500 border border-amber-600/30 rounded-full text-[10px] font-bold mb-4">
        OMO5 KUMAMOTO NEIGHBORHOOD GUIDE
      </div>
      <h1 class="text-3xl md:text-5xl font-black leading-tight mb-3">
        通常営業<br><span class="text-amber-500">曜日別ガイド</span>
        <span class="text-white/50 text-xl md:text-2xl ml-2">（CSV連携）</span>
      </h1>
      <div id="load-msg" class="mt-4 text-[11px] text-stone-300 hidden">データを読み込んでいます…</div>
    </div>
    <div class="absolute -right-20 -bottom-20 w-64 h-64 bg-amber-600/10 rounded-full blur-3xl"></div>
  </header>

  <main class="max-w-6xl mx-auto px-4 -mt-10">

    <div class="bg-white rounded-3xl p-3 shadow-2xl border border-stone-100 sticky top-4 z-50 mb-8">
      <div class="flex overflow-x-auto gap-2 no-scrollbar" id="day-tabs">
        <button onclick="changeDay('月')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="月"><span class="block text-[10px] opacity-50">MON</span><span class="block font-bold">月</span></button>
        <button onclick="changeDay('火')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="火"><span class="block text-[10px] opacity-50">TUE</span><span class="block font-bold">火</span></button>
        <button onclick="changeDay('水')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="水"><span class="block text-[10px] opacity-50">WED</span><span class="block font-bold">水</span></button>
        <button onclick="changeDay('木')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="木"><span class="block text-[10px] opacity-50">THU</span><span class="block font-bold">木</span></button>
        <button onclick="changeDay('金')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="金"><span class="block text-[10px] opacity-50">FRI</span><span class="block font-bold">金</span></button>
        <button onclick="changeDay('土')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="土"><span class="block text-[10px] opacity-50">SAT</span><span class="block font-bold">土</span></button>
        <button onclick="changeDay('日')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="日"><span class="block text-[10px] opacity-50">SUN</span><span class="block font-bold">日</span></button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8 items-stretch">
      
      <div class="lg:col-span-8 bg-white rounded-[2.5rem] p-6 shadow-sm border border-stone-100 flex flex-col md:flex-row gap-6">
        <div class="flex-grow">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold flex items-center gap-2">
              <span class="w-2 h-5 bg-amber-500 rounded-full"></span>
              <span id="cur-day-label">月</span>曜日のサマリー
            </h3>
          </div>
          
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="bg-stone-50 rounded-2xl p-4 border border-stone-100">
              <div class="text-[10px] text-stone-400 font-bold mb-1 uppercase tracking-wider">Open</div>
              <div class="text-3xl font-black text-green-600 leading-none"><span id="open-count">0</span><span class="text-xs ml-1 text-stone-400 font-normal">件</span></div>
            </div>
            <div class="bg-stone-50 rounded-2xl p-4 border border-stone-100">
              <div class="text-[10px] text-stone-400 font-bold mb-1 uppercase tracking-wider">Closed</div>
              <div class="text-3xl font-black text-stone-400 leading-none"><span id="close-count">0</span><span class="text-xs ml-1 text-stone-400 font-normal">件</span></div>
            </div>
            <div class="bg-stone-50 rounded-2xl p-4 border border-stone-100">
              <div class="text-[10px] text-stone-400 font-bold mb-1 uppercase tracking-wider">Night (21-)</div>
              <div class="text-3xl font-black text-amber-600 leading-none"><span id="night-rate">0</span><span class="text-xs ml-1 text-stone-400 font-normal">%</span></div>
              <div class="text-[9px] text-stone-400 mt-1">(<span id="night-count">0</span>件)</div>
            </div>
            <div class="bg-stone-50 rounded-2xl p-4 border border-stone-100">
              <div class="text-[10px] text-stone-400 font-bold mb-1 uppercase tracking-wider">Filtered</div>
              <div class="text-3xl font-black text-stone-800 leading-none"><span id="shown-count">0</span><span class="text-xs ml-1 text-stone-400 font-normal">件</span></div>
              <div class="text-[9px] text-stone-400 mt-1">Total: <span id="all-count">0</span></div>
            </div>
          </div>
        </div>

        <div class="md:w-48 flex flex-col items-center justify-center border-t md:border-t-0 md:border-l border-stone-100 pt-6 md:pt-0 md:pl-6">
          <div class="chart-container">
            <canvas id="ratioChart"></canvas>
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
              <span class="text-[10px] text-stone-400 font-bold">営業率</span>
              <span id="open-percent" class="text-lg font-black leading-none">0%</span>
            </div>
          </div>
          <div class="mt-4 text-[9px] text-stone-400 leading-tight text-center">
            判定：休/休みを含む場合は「休み」<br>それ以外は「営業」として集計
          </div>
        </div>
      </div>

      <div class="lg:col-span-4 bg-white rounded-[2.5rem] p-6 shadow-sm border border-stone-100 flex flex-col">
        <h3 class="font-bold mb-4 flex items-center gap-2">
          <span class="w-2 h-5 bg-stone-800 rounded-full"></span>
          絞り込み検索
        </h3>
        
        <div class="relative mb-4">
          <input
            id="search-input"
            type="text"
            placeholder="店名で検索..."
            class="w-full pl-4 pr-10 py-3 rounded-2xl border border-stone-200 bg-stone-50 text-sm outline-none focus:ring-2 focus:ring-amber-200 transition-all"
            oninput="setQuery(this.value)"
          />
          <button onclick="clearQuery()" class="absolute right-3 top-1/2 -translate-y-1/2 text-stone-300 hover:text-stone-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" /></svg>
          </button>
        </div>

        <div id="cat-buttons" class="flex flex-wrap gap-2 overflow-y-auto no-scrollbar max-h-32">
          </div>
      </div>
    </div>

    <div id="shop-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    <div id="empty-state" class="hidden py-20 text-center bg-stone-100 rounded-[2.5rem] border-2 border-dashed border-stone-200">
      <p class="text-stone-400 text-sm">該当する店舗がありません。</p>
    </div>
    <div id="error-state" class="hidden py-14 text-center bg-red-50 rounded-[2.5rem] border border-red-200">
      <p class="text-red-700 font-bold">CSVの読み込みに失敗しました。</p>
    </div>

  </main>

  <footer class="mt-20 py-12 bg-stone-900 text-stone-500 px-6 text-center">
    <p class="text-xs font-bold text-white mb-2">OMO5熊本 by 星野リゾート</p>
    <p class="text-[10px] max-w-xs mx-auto opacity-50">
      ※情報はCSVから抽出した通常営業データです。当日の急な変更は各店へご確認ください。
    </p>
  </footer>

  <script>
    const CSV_PATH = './data.csv';
    let db = [];
    let curDay = '月';
    let curCat  = 'all';
    let curQuery = '';
    let myChart = null;
    const DAY_KEYS = ['月','火','水','木','金','土','日'];

    function normalizeText(s) {
      return String(s ?? '').replace(/^\uFEFF/, '').replace(/\r/g, '').replace(/\n/g, ' ').replace(/[ 　]+/g, ' ').trim();
    }
    function setQuery(q){ curQuery = normalizeText(q); render(); }
    function clearQuery(){
      curQuery = '';
      const inp = document.getElementById('search-input');
      if (inp) inp.value = '';
      render();
    }
    function escapeHtml(s){
      return String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
    }
    function isClosed(status) {
      const s = normalizeText(status);
      return /休(み)?/.test(s);
    }
    function statusLabel(status) {
      const s = normalizeText(status);
      return s ? s.replace(/：/g, ':') : '—';
    }
    function toHalfWidth(s){
      return String(s ?? '').replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/：/g, ':');
    }
    function isNightOpen(status){
      const s = toHalfWidth(normalizeText(status));
      const m = s.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
      if (!m) return false;
      return parseInt(m[3], 10) >= 21;
    }
    function parseBasicInfo(noteRaw) {
      const note = normalizeText(noteRaw);
      const info = { tel:'', address:'', hours:'', url:'', note:'', rest:'' };
      if (!note) return info;
      const lines = note.split(/\s*\/\s*|\s*\n\s*/).map(l => normalizeText(l)).filter(Boolean);
      for (const line of lines) {
        const m = line.match(/^([A-Z]+)\s*:\s*(.+)$/);
        if (!m) { info.rest += (info.rest ? ' / ' : '') + line; continue; }
        const key = m[1].toUpperCase();
        const val = normalizeText(m[2]);
        if (key === 'TEL') info.tel = val;
        else if (key === 'ADDR') info.address = val;
        else if (key === 'HOURS') info.hours = val;
        else if (key === 'URL') info.url = val;
        else if (key === 'NOTE') info.note = val;
        else info.rest += (info.rest ? ' / ' : '') + line;
      }
      return info;
    }

    function changeDay(day) {
      curDay = day;
      document.querySelectorAll('.day-btn').forEach(btn => btn.classList.toggle('day-active', btn.dataset.day === day));
      render();
    }
    function setCat(cat) {
      curCat = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.toggle('cat-active', btn.dataset.cat === cat));
      render();
    }

    function renderCatButtons() {
      const box = document.getElementById('cat-buttons');
      box.innerHTML = '';
      const cats = Array.from(new Set(db.map(d => d.category))).sort((a,b)=>a.localeCompare(b,'ja'));
      ['all', ...cats].forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn px-4 py-2 bg-stone-100 rounded-full text-[10px] font-bold transition whitespace-nowrap';
        btn.dataset.cat = cat;
        btn.onclick = () => setCat(cat);
        btn.textContent = (cat === 'all') ? 'すべて' : cat;
        if (cat === 'all') btn.classList.add('cat-active');
        box.appendChild(btn);
      });
    }

    function updateStats(open, total) {
      const close = total - open;
      const percent = total > 0 ? Math.round((open / total) * 100) : 0;
      document.getElementById('open-percent').textContent = percent + '%';
      
      const ctx = document.getElementById('ratioChart').getContext('2d');
      if (myChart) myChart.destroy();
      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: { datasets: [{ data: [open, close], backgroundColor: ['#10b981', '#e5e7eb'], borderWeight: 0, hoverOffset: 0 }] },
        options: { cutout: '82%', plugins: { tooltip: { enabled: false }, legend: { display: false } }, events: [] }
      });
    }

    function render() {
      const listContainer = document.getElementById('shop-list');
      const emptyState = document.getElementById('empty-state');
      listContainer.innerHTML = '';

      const q = normalizeText(curQuery).toLowerCase();
      const filtered = db.filter(d => {
        const okCat = (curCat === 'all' || d.category === curCat);
        const okQuery = (!q || (d.name || '').toLowerCase().includes(q));
        return okCat && okQuery;
      });

      let openCount = 0;
      let nightCount = 0;

      filtered.forEach(d => {
        const status = d.schedule[curDay] ?? '';
        const closed = isClosed(status);
        if (!closed) {
          openCount++;
          if(isNightOpen(status)) nightCount++;
        }

        const info = d.info || {};
        const card = document.createElement('div');
        card.className = `bg-white p-5 rounded-[2rem] border border-stone-100 flex justify-between items-start gap-4 transition-all ${closed ? 'opacity-40 grayscale bg-stone-50' : 'hover:custom-shadow shadow-sm'}`;

        card.innerHTML = `
          <div class="flex-grow min-w-0">
            <div class="flex items-center gap-2 mb-2">
              <span class="px-2 py-0.5 ${closed ? 'bg-stone-200 text-stone-600' : 'bg-green-100 text-green-700'} text-[9px] font-bold rounded uppercase">${closed ? 'Closed' : 'Open'}</span>
              <h4 class="font-bold text-sm text-stone-800 truncate">${escapeHtml(d.name)}</h4>
            </div>
            <div class="text-[10px] text-amber-600 font-bold mb-3"># ${escapeHtml(d.category)}</div>
            <div class="space-y-1 text-[11px] text-stone-500">
              ${info.hours ? `<div><span class="font-bold text-stone-400 mr-1">HOURS:</span>${escapeHtml(info.hours)}</div>` : ''}
              ${info.tel ? `<div><span class="font-bold text-stone-400 mr-1">TEL:</span>${escapeHtml(info.tel)}</div>` : ''}
              ${info.url ? `<div class="pt-1"><a href="${escapeHtml(info.url)}" target="_blank" class="text-amber-600 underline font-bold">公式リンク</a></div>` : ''}
            </div>
          </div>
          <div class="text-right flex-shrink-0">
            <p class="text-sm font-black text-stone-800">${escapeHtml(statusLabel(status))}</p>
            <p class="text-[8px] text-stone-400 uppercase tracking-tighter">Current Status</p>
          </div>
        `;
        listContainer.appendChild(card);
      });

      emptyState.classList.toggle('hidden', filtered.length > 0);
      document.getElementById('cur-day-label').textContent = curDay;
      document.getElementById('open-count').textContent = openCount;
      document.getElementById('close-count').textContent = filtered.length - openCount;
      document.getElementById('shown-count').textContent = filtered.length;
      document.getElementById('all-count').textContent = db.length;
      document.getElementById('night-rate').textContent = filtered.length > 0 ? Math.round((nightCount / filtered.length) * 100) : 0;
      document.getElementById('night-count').textContent = nightCount;
      
      updateStats(openCount, filtered.length);
    }

    async function loadCsv() {
      const msg = document.getElementById('load-msg');
      const err = document.getElementById('error-state');
      msg.classList.remove('hidden');

      try {
        const res = await fetch(CSV_PATH, { cache: 'no-store' });
        if (!res.ok) throw new Error();
        const text = await res.text();
        const parsed = Papa.parse(text, { skipEmptyLines: true });
        const rows = parsed.data.map(r => r.map(c => normalizeText(c))).filter(r => r.some(c => c !== ''));

        const headerIdx = rows.findIndex(r => r.includes('店名'));
        const header = rows[headerIdx];
        const idxName = header.indexOf('店名');
        const idxCat  = header.indexOf('カテゴリ');
        const idxNote = header.indexOf('備考') >= 0 ? header.indexOf('備考') : header.length - 1;
        const idxDay = {}; DAY_KEYS.forEach(d => idxDay[d] = header.indexOf(d));

        db = rows.slice(headerIdx + 1).map(r => {
          const note = normalizeText(r[idxNote]);
          const schedule = {}; DAY_KEYS.forEach(d => schedule[d] = r[idxDay[d]]);
          return { name: r[idxName], category: r[idxCat] || '未分類', schedule, note, info: parseBasicInfo(note) };
        }).filter(d => d.name).sort((a,b)=>a.name.localeCompare(b.name,'ja'));

        msg.classList.add('hidden');
        renderCatButtons();
        render();
      } catch (e) {
        err.classList.remove('hidden');
        console.error(e);
      }
    }

    window.onload = loadCsv;
  </script>
</body>
</html>
