<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMO5熊本：通常営業（曜日別）ご近所ガイド</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --omo-black:#1c1917;
      --omo-gold:#d97706;
      --omo-red:#991b1b;
      --omo-bg:#fafaf9;
    }
    body{font-family:'Noto Sans JP',sans-serif;background:var(--omo-bg);color:var(--omo-black);}
    .chart-container{position:relative;width:100%;height:240px;margin:auto;}
    .day-active{background-color:var(--omo-red)!important;color:white!important;transform:scale(1.05);}
    .cat-active{background-color:var(--omo-gold)!important;color:white!important;}
    .custom-shadow{box-shadow:0 10px 15px -3px rgba(0,0,0,0.05),0 4px 6px -2px rgba(0,0,0,0.02);}
    .no-scrollbar::-webkit-scrollbar{display:none;}
    .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
  </style>
</head>

<body class="antialiased min-h-screen">

  <!-- Header -->
  <header class="bg-stone-900 text-white pt-10 pb-14 px-6 rounded-b-[3rem] shadow-2xl relative overflow-hidden">
    <div class="max-w-2xl mx-auto relative z-10">
      <div class="inline-flex items-center gap-2 px-3 py-1 bg-amber-600/20 text-amber-500 border border-amber-600/30 rounded-full text-[10px] font-bold mb-4">
        OMO5 KUMAMOTO NEIGHBORHOOD GUIDE
      </div>
      <h1 class="text-3xl md:text-5xl font-black leading-tight mb-3">
        通常営業<br><span class="text-amber-500">曜日別ガイド</span><br>
        <span class="text-white/50 text-2xl md:text-3xl">（CSV連携）</span>
      </h1>

      <!-- ※編集中メモ：ここに説明文を入れて良い／最終版では削除 -->
      <p class="text-stone-400 text-xs md:text-sm">
        <!-- ※ここは後で消す：CSVの曜日列（月〜日）で「休み」を判定し、その他は営業として扱います。 -->
      </p>

      <div id="load-msg" class="mt-4 text-[11px] text-stone-300 hidden">
        データを読み込んでいます…
      </div>
    </div>
    <div class="absolute -right-20 -bottom-20 w-64 h-64 bg-amber-600/10 rounded-full blur-3xl"></div>
  </header>

  <main class="max-w-5xl mx-auto px-4 -mt-8">

    <!-- Day Selector -->
    <div class="bg-white rounded-3xl p-3 shadow-2xl border border-stone-100 sticky top-4 z-50 mb-8">
      <div class="flex overflow-x-auto gap-2 no-scrollbar" id="day-tabs">
        <button onclick="changeDay('月')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="月">
          <span class="block text-[10px] opacity-50">MON</span><span class="block font-bold">月</span>
        </button>
        <button onclick="changeDay('火')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="火">
          <span class="block text-[10px] opacity-50">TUE</span><span class="block font-bold">火</span>
        </button>
        <button onclick="changeDay('水')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="水">
          <span class="block text-[10px] opacity-50">WED</span><span class="block font-bold">水</span>
        </button>
        <button onclick="changeDay('木')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="木">
          <span class="block text-[10px] opacity-50">THU</span><span class="block font-bold">木</span>
        </button>
        <button onclick="changeDay('金')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="金">
          <span class="block text-[10px] opacity-50">FRI</span><span class="block font-bold">金</span>
        </button>
        <button onclick="changeDay('土')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="土">
          <span class="block text-[10px] opacity-50">SAT</span><span class="block font-bold">土</span>
        </button>
        <button onclick="changeDay('日')" class="day-btn flex-shrink-0 flex-grow basis-1/7 min-w-[70px] border border-stone-100 rounded-2xl py-3 text-center transition-all" data-day="日">
          <span class="block text-[10px] opacity-50">SUN</span><span class="block font-bold">日</span>
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

      <!-- Left Panel -->
      <div class="space-y-6">
        <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-stone-100">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold">本日の活気</h3>
            <div class="text-right">
              <span id="open-count" class="text-2xl font-black text-green-600">0</span>
              <span class="text-[10px] text-stone-400"> / <span id="total-count">0</span>件 営業</span>
            </div>
          </div>
          <div class="chart-container">
            <canvas id="ratioChart"></canvas>
          </div>
          <!-- ※編集中メモ：営業判定ルール -->
          <div class="mt-3 text-[11px] text-stone-500">
            <!-- ※ここは後で消す：営業扱い＝その曜日の欄が「休」/「休み」を含まないもの -->
            営業扱い：その曜日の欄が「休」/「休み」を含まないもの
          </div>
        </div>

        <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-stone-100">
          <h3 class="font-bold mb-4">カテゴリで絞り込む</h3>
          <div id="cat-buttons" class="flex flex-wrap gap-2"></div>
          <!-- ※編集中メモ：CSVにカテゴリ列がある想定 -->
          <div class="mt-3 text-[11px] text-stone-500">
            <!-- ※ここは後で消す：CSVの「カテゴリ」列をそのまま使用します（空欄は「未分類」扱い）。 -->
          </div>
        </div>
      </div>

      <!-- Right Panel -->
      <div class="lg:col-span-2 space-y-4">
        <div id="shop-list" class="space-y-4"></div>

        <div id="empty-state" class="hidden py-20 text-center bg-stone-100 rounded-[2.5rem] border-2 border-dashed border-stone-200">
          <p class="text-stone-400 text-sm">該当する店舗がありません。</p>
        </div>

        <div id="error-state" class="hidden py-14 text-center bg-red-50 rounded-[2.5rem] border border-red-200">
          <p class="text-red-700 font-bold">CSVの読み込みに失敗しました。</p>
          <p class="text-red-700/80 text-sm mt-2">
            ファイル名が原因のことが多いです。<br>
            同じフォルダに <b>data.csv</b> という名前で置いてください。
          </p>
        </div>
      </div>

    </div>
  </main>

  <footer class="mt-20 py-12 bg-stone-900 text-stone-500 px-6 text-center">
    <p class="text-xs font-bold text-white mb-2">OMO5熊本 by 星野リゾート</p>
    <p class="text-[10px] max-w-xs mx-auto">
      ※情報はCSVから抽出した通常営業データです。<br>
      当日の急な営業変更等については各店舗へお電話にてご確認ください。
    </p>
  </footer>

  <script>
    // =========================
    // 1) CSV PATH
    // =========================
    // GitHub Pages で URL エンコード事故を避けるため、CSVは「data.csv」にリネーム推奨。
    const CSV_PATH = './data.csv';

    // =========================
    // 2) App State
    // =========================
    let db = [];               // {name, category, schedule, note, info}
    let curDay = '月';
    let curCat  = 'all';
    let myChart = null;

    // =========================
    // 3) Helpers
    // =========================
    const DAY_KEYS = ['月','火','水','木','金','土','日'];

    function normalizeText(s) {
      return String(s ?? '')
        .replace(/\\r/g, '')
        .replace(/\\n/g, ' ')
        .replace(/[ 　]+/g, ' ')
        .trim();
    }

    function isClosed(status) {
      const s = normalizeText(status);
      return /休(み)?/.test(s);
    }

    function statusLabel(status) {
      const s = normalizeText(status);
      return s ? s.replace(/：/g, ':') : '—';
    }

    // 備考欄から「電話/住所/URL」などを抽出（見つからない場合は空）
    function parseBasicInfo(noteRaw) {
      // =========================
      // 備考欄：統一書式（厳格パース）
      // -------------------------
      // 1行1項目、必ず「LABEL: value」
      // 例）
      // TEL: 096-123-4567
      // ADDR: 熊本県熊本市中央区〇〇
      // HOURS: 11:00-20:00（L.O.19:30）
      // URL（未入力ならGoogleマップ検索を生成）
        if (info.url) {
          infoLines.push(`<div class="text-[11px] text-stone-600"><span class="font-bold">URL</span>：<a class="underline" href="${info.url}" target="_blank" rel="noreferrer">${escapeHtml(info.url)}</a></div>`);
        } else if (info.address) {
          const gmap = googleMapSearchUrl(info.address);
          infoLines.push(`<div class="text-[11px] text-stone-600"><span class="font-bold">MAP</span>：<a class="underline" href="${gmap}" target="_blank" rel="noreferrer">Googleマップで検索</a></div>`);
        }
        // NOTE（任意メモ）

        if (info.note) infoLines.push(`<div class="text-[11px] text-stone-500 mt-2 leading-relaxed"><span class="font-bold">NOTE</span>：${escapeHtml(info.note)}</div>`);

        // 想定外行（ラベルなし／未知ラベルなど）は「REST」として残す（編集中の保険）
        const memo = info.rest ? `<div class="text-[11px] text-stone-500 mt-2 leading-relaxed"><span class="font-bold">REST</span>：${escapeHtml(info.rest)}</div>` : '';

        const card = document.createElement('div');
        card.className = `bg-white p-5 rounded-[2rem] shadow-sm border border-stone-100 flex justify-between items-start gap-4 transition-all ${closed ? 'opacity-40 grayscale' : 'hover:custom-shadow'}`;

        card.innerHTML = `
          <div class="flex-grow min-w-0">
            <div class="flex items-center gap-2 mb-1">
              ${badge}
              <h4 class="font-bold text-sm text-stone-800 truncate">${escapeHtml(d.name)}</h4>
            </div>

            <div class="text-[10px] text-stone-400 mb-2">
              <span class="font-bold">カテゴリ</span>：${escapeHtml(cat)}
            </div>

            <div class="space-y-1">
              ${infoLines.join('') || `<div class="text-[11px] text-stone-500">（基本情報：備考欄に未入力／書式：TEL: / ADDR: / HOURS: / URL: / NOTE:）</div>`}
            </div>

            <!-- ※編集中メモ：ここは最終版で消す候補 -->
            ${memo}
          </div>

          <div class="text-right flex-shrink-0">
            <p class="text-xs font-black text-stone-800">${escapeHtml(stat)}</p>
            <p class="text-[8px] text-stone-400 uppercase tracking-widest">Status</p>
          </div>
        `;
        listContainer.appendChild(card);
      });

      emptyState.classList.toggle('hidden', total > 0);

      document.getElementById('open-count').textContent = open;
      document.getElementById('total-count').textContent = total;

      updateStats(open, total - open);
    }

    function escapeHtml(s){
      return String(s ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#39;");
    }

    function googleMapSearchUrl(address) {
      if (!address) return '';
      const q = encodeURIComponent(address);
      return `https://www.google.com/maps/search/?api=1&query=${q}`;
    }

    function updateStats(openCount, closeCount) {
      const ctx = document.getElementById('ratioChart').getContext('2d');
      if (myChart) myChart.destroy();
      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [openCount, closeCount],
            backgroundColor: ['#10b981', '#e5e7eb'],
            borderWidth: 0
          }]
        },
        options: {
          cutout: '85%',
          plugins: { tooltip: { enabled: false }, legend: { display: false } }
        }
      });
    }

    // =========================
    // 6) CSV Loader (曜日＆カテゴリ対応)
    // =========================
    async function loadCsv() {
      const msg = document.getElementById('load-msg');
      const err = document.getElementById('error-state');

      // 読み込み中表示（成功で消す／失敗でエラー表示）
      msg.classList.remove('hidden');
      msg.textContent = 'データを読み込んでいます…';
      err.classList.add('hidden');

      try {
        const res = await fetch(CSV_PATH, { cache: 'no-store' });
        if (!res.ok) throw new Error('fetch failed');
        const text = await res.text();

        const parsed = Papa.parse(text, { skipEmptyLines: true });

        // 行を正規化
        const rows = (parsed.data || [])
          .map(r => (r || []).map(c => normalizeText(c)))
          .filter(r => r.some(c => c !== ''));

        // ヘッダー行を探す（"店名" を含み、曜日っぽい列も含む）
        const headerIdx = rows.findIndex(r => r.includes('店名') && DAY_KEYS.some(d => r.includes(d)));
        const header = headerIdx >= 0 ? rows[headerIdx] : [];
        const start = headerIdx >= 0 ? headerIdx + 1 : 0;

        // 列インデックス（無ければフォールバック）
        const idxName = header.indexOf('店名') >= 0 ? header.indexOf('店名') : 2;
        const idxCat  = header.indexOf('カテゴリ') >= 0 ? header.indexOf('カテゴリ') : 3;

        const idxDay = {};
        DAY_KEYS.forEach(d => {
          const i = header.indexOf(d);
          idxDay[d] = (i >= 0) ? i : null;
        });

        // 備考列（見つからなければ最後）
        const idxNote = header.indexOf('備考') >= 0 ? header.indexOf('備考') : (header.length ? header.length - 1 : 11);

        const out = [];

        for (let i = start; i < rows.length; i++) {
          const r = rows[i] || [];

          const rawName = r[idxName] ?? '';
          if (!rawName || rawName === '店名') continue;

          const name = normalizeText(rawName);
          const category = normalizeText(r[idxCat] ?? '') || '未分類';

          const schedule = {};
          DAY_KEYS.forEach(d => {
            const col = idxDay[d];
            schedule[d] = (col === null) ? '' : (r[col] ?? '');
          });

          // 備考
          const note = normalizeText(r[idxNote] ?? '');

          out.push({
            name,
            category,
            schedule,
            note,
            info: parseBasicInfo(note),
          });
        }

        // 同名重複を統合（空欄だけ埋める）
        const merged = new Map();
        out.forEach(item => {
          const key = item.name;
          if (!merged.has(key)) {
            merged.set(key, item);
            return;
          }
          const cur = merged.get(key);
          // カテゴリ優先：既存が未分類なら上書き
          if ((cur.category === '未分類') && item.category && item.category !== '未分類') cur.category = item.category;
          // 曜日：空欄のみ埋める
          DAY_KEYS.forEach(d => {
            if (!cur.schedule[d] && item.schedule[d]) cur.schedule[d] = item.schedule[d];
          });
          // 備考：空欄のみ埋める
          if (!cur.note && item.note) {
            cur.note = item.note;
            cur.info = parseBasicInfo(item.note);
          }
        });

        db = Array.from(merged.values())
          .filter(d => d.name)
          .sort((a,b) => a.name.localeCompare(b.name, 'ja'));

        // 成功：読み込み表示を消す
        msg.textContent = '';
        msg.classList.add('hidden');
        err.classList.add('hidden');

        renderCatButtons();
        // 初期ハイライト
        document.querySelectorAll('.day-btn').forEach(btn => {
          btn.classList.toggle('day-active', btn.dataset.day === curDay);
        });
        render();

      } catch (e) {
        err.classList.remove('hidden');
        msg.classList.remove('hidden');
        msg.textContent = '読み込み失敗（CSVを取得できませんでした）';
        console.error(e);
      }
    }

    window.onload = () => {
      // 初期ハイライト
      document.querySelectorAll('.day-btn').forEach(btn => {
        btn.classList.toggle('day-active', btn.dataset.day === curDay);
      });
      loadCsv();
    };
  </script>
</body>
</html>
